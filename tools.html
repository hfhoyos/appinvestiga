<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herramientas IA para la Investigación · SENA</title><style>
:root{--ink:#102b50;--muted:#526780;--green:#087e43;--blue:#176ec4;--line:#d8e5f1;--bg:#f0f6fb;--shadow:0 14px 38px #102b5016;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #f3b521;outline-offset:3px}.hidden{display:none!important}
#inicio{min-height:100svh;background:#071e3d;display:grid;place-items:end center;position:relative;padding:22px}#inicio picture,#inicio picture img{position:absolute;inset:0;width:100%;height:100%}#inicio picture img{object-fit:contain}.enter{position:relative;z-index:1;border:0;border-radius:100px;background:linear-gradient(105deg,#087b3b,#47bf20);color:#fff;font-weight:850;letter-spacing:.05em;padding:17px 38px;box-shadow:0 9px 30px #0008;margin-bottom:2vh}.enter:hover{filter:brightness(1.08)}.banner{display:block;width:100%;aspect-ratio:5/1;object-fit:cover}.sticky-banner{position:sticky;top:0;z-index:4;box-shadow:0 3px 15px #092a4b20}.wrap{max-width:1200px;margin:auto;padding:28px 22px 65px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{color:var(--green);font-size:.9rem;font-weight:850}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:100px;padding:10px 16px;font-weight:750}.intro h1{font-size:clamp(2rem,4.5vw,3.5rem);letter-spacing:-.045em;margin:8px 0}.intro p{color:var(--muted);margin:0 0 22px}.floors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:24px 0 28px}.floor{border:2px solid var(--line);background:white;border-radius:17px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink);box-shadow:var(--shadow);transition:.2s}.floor:hover,.room:hover{transform:translateY(-3px)}.floor .emoji{font-size:1.7rem}.floor small{color:var(--muted)}.floor[aria-pressed="true"]{border-color:var(--tone);background:color-mix(in srgb,var(--tone) 8%,white)}.selected{border-left:5px solid var(--tone);padding-left:15px;margin:0 0 20px}.selected span{font-weight:850;color:var(--tone);font-size:.9rem}.selected h2{margin:5px 0;font-size:clamp(1.5rem,3vw,2rem)}.selected p{margin:0;color:var(--muted)}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:17px}.room{border:1px solid var(--line);background:#fff;border-radius:19px;padding:0;overflow:hidden;text-align:left;color:var(--ink);box-shadow:var(--shadow);transition:.2s}.room-art{height:145px;background:linear-gradient(130deg,#d5eaf9,#e3f7ed);display:grid;place-items:center;font-size:3.5rem;position:relative}.room:nth-child(2) .room-art{background:linear-gradient(130deg,#fff0cf,#dceffd)}.room:nth-child(3) .room-art{background:linear-gradient(130deg,#e5e4ff,#d9f7f2)}.room:nth-child(4) .room-art{background:linear-gradient(130deg,#dff7e7,#e5edff)}.tag{position:absolute;top:12px;right:12px;background:white;border-radius:30px;padding:6px 10px;font-size:.7rem;font-weight:800;color:#66541a}.room-info{padding:18px;display:flex;align-items:center;gap:8px}.room-info strong{display:block;font-size:1rem}.room-info small{display:block;margin-top:6px;color:var(--muted);line-height:1.4}.arrow{margin-left:auto;font-size:1.7rem}.footer{text-align:center;color:#74849a;font-size:.85rem;margin-top:40px}
#roomView{min-height:100svh;background:linear-gradient(145deg,#eaf4fd,#fff 48%,#eaf6f0)}.room-head{background:linear-gradient(110deg,#0c3e75,#086c51);color:white;padding:18px max(22px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.room-head .secondary{background:#ffffff1b;color:white;border-color:#ffffff66}.room-shell{max-width:1160px;margin:auto;padding:30px 22px 70px}.room-kicker{color:var(--green);font-weight:850;font-size:.9rem}.room-title{font-size:clamp(2rem,4vw,3.2rem);line-height:1.13;margin:8px 0}.room-lead{color:var(--muted);font-size:1.06rem;max-width:820px}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0 20px;border-bottom:1px solid var(--line);padding-bottom:15px}.tab{border:1px solid #cbdce9;background:white;border-radius:100px;padding:11px 17px;font-weight:750;color:var(--ink)}.tab[aria-selected="true"]{background:var(--green);color:white;border-color:var(--green)}.panel{background:white;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:clamp(18px,3vw,32px);min-height:280px}.panel h2{margin-top:0}.panel h3{color:#1465aa}.panel p,.panel li{line-height:1.7}.panel li{margin-bottom:8px}.resource-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px;margin:18px 0}.resource{border:1px solid var(--line);border-radius:14px;background:#f8fbfe;padding:17px}.resource h3{margin:0 0 8px;font-size:1.05rem}.resource p{margin:0;color:var(--muted);font-size:.9rem}.notice{border-left:4px solid #f0a529;background:#fff8e8;padding:15px 18px;border-radius:0 12px 12px 0;margin:18px 0}.activity{background:#f6fbf8;border:1px solid #cce8d6;border-radius:15px;padding:20px;margin:16px 0}.activity h3{margin-top:0}.field{display:block;font-weight:700;margin:16px 0 7px}.text-field{display:block;width:100%;border:1px solid #b8cbdc;border-radius:11px;padding:12px;min-height:110px;resize:vertical;font:inherit}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.primary{border:0;background:var(--green);color:white;border-radius:11px;padding:11px 18px;font-weight:750}.outline{border:1px solid #cbdce9;background:white;color:var(--ink);border-radius:11px;padding:11px 18px;font-weight:750}.status{color:var(--green);font-weight:700;min-height:1.3em;margin-top:10px}.crumb{font-size:.88rem;opacity:.88}.empty-state{text-align:center;padding:40px 15px}.empty-state .big{font-size:3rem}.progress{display:inline-block;border-radius:100px;background:#e8f5ee;color:#0a6e3a;padding:5px 12px;font-weight:800;font-size:.8rem}
.level-switch{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.level-btn{background:#f1f6fc;border:1px solid #cbdce9;color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:750}.level-btn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:white}.level-detail{border:1px solid var(--line);background:#f8fbfe;border-radius:16px;padding:20px}.tool-links{display:flex;flex-wrap:wrap;gap:9px}.tool-links a{border:1px solid #b8d8ee;border-radius:100px;padding:8px 12px;background:#fff;color:#075c99;text-decoration:none;font-weight:700}.tool-links a:hover{text-decoration:underline}.external-resource{display:inline-block;background:#087e43;color:#fff!important;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:750;margin-top:7px}.external-resource:hover{filter:brightness(1.1)}.helper-note{font-size:.85rem;color:var(--muted)}@media(max-width:700px){#inicio{padding:15px}.enter{width:min(94%,390px);margin-bottom:12px}.sticky-banner{position:static}.wrap{padding:22px 15px 50px}.floors{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.floor:last-child{grid-column:1/-1}.floor{padding:12px}.rooms{grid-template-columns:1fr;gap:12px}.room{display:flex;min-height:112px}.room-art{width:34%;height:auto;min-height:112px;flex-shrink:0;font-size:2.5rem}.tag{top:5px;right:5px;font-size:.6rem;padding:4px 6px}.room-info{flex:1;padding:12px}.room-head{padding:15px}.room-shell{padding:22px 15px 50px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.tab{padding:10px 7px;font-size:.83rem}.panel{padding:17px}.topline .secondary{font-size:.82rem}}
.empathy-figure{margin:20px 0 24px}.empathy-figure img{display:block;width:100%;height:auto;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:#fff}.empathy-figure figcaption{margin-top:8px;color:var(--muted);font-size:.9rem;text-align:center}.empathy-figure.image-missing{display:none}.presentation-image{display:block;width:100%;height:auto;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:#fff}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><section id="roomView"><header class="room-head"><div><div class="crumb">Piso 4 · Jueves 29 de octubre de 2026</div><strong>Memorias y laboratorio pedagógico · SENA</strong></div><span class="secondary">🔬 Habitación 401</span></header><div class="room-shell"><div class="room-kicker">HABITACIÓN 401 · JUEVES 29</div><h1 class="room-title" id="roomTitle"></h1><p class="room-lead" id="roomLead"></p><section class="panel" id="panel" role="tabpanel" tabindex="-1"></section><div class="footer">Edificio del Conocimiento · SENA · Barranquilla 2026</div></div></section><script>
'use strict';
const room={title:'Herramientas IA para la Investigación',icon:'🔬',summary:'Siete niveles de la taxonomía emergente, correspondencia con Hernández Sampieri y herramientas recomendadas con enlaces.',objective:'Relacionar las etapas de una investigación pedagógica con la taxonomía emergente, seleccionar herramientas de IA y preservar el criterio del investigador.',concepts:`<h2>Taxonomía emergente y ruta metodológica de investigación</h2><p>Esta ruta organiza siete niveles de trabajo investigativo, del reconocimiento del contexto a la divulgación. Se presenta una <strong>correspondencia orientadora</strong> con el proceso de investigación descrito por Hernández Sampieri; no se atribuye a ese autor la creación de esta taxonomía.</p><div class="notice"><strong>Dos perspectivas complementarias:</strong> la taxonomía cognitiva del evento (Interrogar, Contextualizar, Contrastar, Verificar, Curar, Arbitrar y Cocrear) describe operaciones del pensamiento; los niveles 0–6 de esta habitación organizan el <em>recorrido metodológico</em> de la investigación.</div><h3>Explora los siete niveles</h3><div class="level-switch" id="researchLevels" role="group" aria-label="Niveles de la taxonomía emergente"></div><div id="researchLevelDetail" class="level-detail" aria-live="polite"></div><div class="notice"><strong>Principio transversal:</strong> la IA apoya la exploración, análisis y escritura, pero el investigador decide el problema, comprueba las fuentes, cuida los datos y asume la responsabilidad de las conclusiones.</div>`,resources:[['Taxonomía emergente por niveles','Ruta 0–6 con objetivo, actividades, responsabilidad humana y herramientas enlazadas en la pestaña Fundamentación.'],['Hernández Sampieri','Correspondencia didáctica con planteamiento, revisión de literatura, diseño, recolección, análisis y reporte de investigación.'],['Selección crítica de herramientas','Evaluar utilidad, acceso, privacidad, confiabilidad y límites de cada servicio antes de usarlo.']],workshop:{title:'Selecciona herramientas para tu investigación pedagógica',steps:['Recupera EL INTERÉS DE INVESTIGACIÓN PEDAGÓGICA del equipo.','Recorre los siete niveles y reconoce qué actividades corresponden a una investigación aún en formulación.','Consulta al menos dos herramientas recomendadas y registra para qué podrían servir.','Contrasta una respuesta o resultado y verifica la información en fuentes originales.','Relaciona el trabajo realizado con la etapa metodológica correspondiente.','Explica qué decisiones no delegará el equipo a la IA.'],prompt:'Registra: interés del equipo, niveles abordados, herramientas exploradas y sus URL, resultados contrastados, relación con Hernández Sampieri, límites encontrados y decisiones humanas.'},deliverable:'Matriz de selección y contraste de herramientas de IA por nivel, vinculada con el avance real de la Ficha de Proyecto.'};
const researchLevels=[
{n:0,name:'Explorar / Situar',question:'¿Qué realidad quiero transformar?',goal:'Reconocer la situación, los actores y el contexto.',activities:'Observar la práctica formativa, escuchar actores y registrar intereses.',sampieri:'Idea de investigación, aproximación al fenómeno y contextualización inicial.',human:'Elegir la situación significativa y escuchar a sus protagonistas.',tools:[['ChatGPT','https://chatgpt.com/'],['Gemini','https://gemini.google.com/'],['Perplexity','https://www.perplexity.ai/'],['iAsk','https://iask.ai/']]},
{n:1,name:'Formular / Delimitar',question:'¿Qué pregunta orienta mi búsqueda?',goal:'Delimitar el problema y formular una pregunta investigable.',activities:'Revisar literatura, identificar vacíos y contrastar preguntas.',sampieri:'Planteamiento del problema, preguntas, objetivos y justificación; revisión inicial de literatura.',human:'Definir la pregunta y valorar su pertinencia y viabilidad.',tools:[['Semantic Scholar','https://www.semanticscholar.org/'],['Consensus','https://consensus.app/'],['Elicit','https://elicit.com/'],['ResearchRabbit','https://www.researchrabbit.ai/'],['Connected Papers','https://www.connectedpapers.com/'],['Litmaps','https://www.litmaps.com/'],['Scite','https://scite.ai/']]},
{n:2,name:'Diseñar / Fundamentar',question:'¿Cómo voy a responder esa pregunta?',goal:'Definir bases conceptuales y decisiones metodológicas.',activities:'Organizar antecedentes, precisar enfoque, técnicas, instrumentos y criterios de análisis.',sampieri:'Marco teórico y diseño de investigación, según el enfoque seleccionado.',human:'Justificar el diseño y revisar la validez y pertinencia de los instrumentos.',tools:[['Elicit','https://elicit.com/'],['Consensus','https://consensus.app/'],['Humata','https://www.humata.ai/'],['Julius AI','https://julius.ai/'],['Typeform','https://www.typeform.com/']]},
{n:3,name:'Aplicar / Verificar',question:'¿Los datos son confiables y válidos?',goal:'Recolectar, organizar y verificar evidencias con rigor.',activities:'Aplicar instrumentos, documentar procedimientos, examinar calidad y protección de datos.',sampieri:'Recolección de datos y control de calidad del procedimiento.',human:'Garantizar consentimiento, confidencialidad, trazabilidad y calidad de evidencias.',tools:[['Dovetail','https://dovetail.com/'],['Julius AI','https://julius.ai/'],['Otter.ai','https://otter.ai/'],['Fireflies.ai','https://fireflies.ai/'],['Microsoft Copilot','https://copilot.microsoft.com/']]},
{n:4,name:'Interpretar / Comunicar',question:'¿Qué significan los hallazgos?',goal:'Analizar datos y construir interpretaciones argumentadas.',activities:'Contrastar hallazgos con la pregunta, los antecedentes y las limitaciones.',sampieri:'Análisis e interpretación de resultados y elaboración del reporte.',human:'Distinguir evidencia de inferencia y asumir las conclusiones.',tools:[['Julius AI','https://julius.ai/'],['Paperpal','https://paperpal.com/'],['Trinka','https://www.trinka.ai/'],['Zotero','https://www.zotero.org/'],['Gamma','https://gamma.app/']]},
{n:5,name:'Evaluar',question:'¿Qué impacto tuvo y qué sigue?',goal:'Valorar alcances, limitaciones y oportunidades de mejora.',activities:'Examinar resultados frente a objetivos, impactos y nuevos interrogantes.',sampieri:'Discusión, conclusiones, limitaciones y recomendaciones.',human:'Juzgar el impacto real sin exagerar hallazgos.',tools:[['Julius AI','https://julius.ai/'],['Notion','https://www.notion.so/product/ai'],['Microsoft Copilot','https://copilot.microsoft.com/'],['ChatGPT','https://chatgpt.com/'],['Claude','https://claude.ai/']]},
{n:6,name:'Transferir / Divulgar',question:'¿Cómo lo comparto y lo hago útil?',goal:'Comunicar resultados de forma accesible y responsable.',activities:'Preparar informes, presentaciones, repositorios y productos de transferencia.',sampieri:'Comunicación del reporte de investigación y difusión de resultados.',human:'Responder por la autoría, el contexto, las fuentes y los destinatarios.',tools:[['Paperpal','https://paperpal.com/'],['Trinka','https://www.trinka.ai/'],['Gamma','https://gamma.app/'],['DeepL','https://www.deepl.com/translator'],['ResearchGate','https://www.researchgate.net/']]}
];
function renderResearchLevel(n){const level=researchLevels[n]||researchLevels[0];const buttons=document.getElementById('researchLevels');const detail=document.getElementById('researchLevelDetail');if(!buttons||!detail)return;buttons.innerHTML=researchLevels.map(l=>`<button type="button" class="level-btn" data-level="${l.n}" aria-pressed="${l.n===level.n}">${l.n} · ${l.name}</button>`).join('');detail.innerHTML=`<h3>Nivel ${level.n} · ${level.name}</h3><p><strong>Pregunta:</strong> ${level.question}</p><p><strong>Objetivo:</strong> ${level.goal}</p><p><strong>Actividades clave:</strong> ${level.activities}</p><p><strong>Correspondencia orientadora con Hernández Sampieri:</strong> ${level.sampieri}</p><div class="notice"><strong>Lo que el investigador no delega:</strong> ${level.human}</div><h3>Herramientas recomendadas</h3><div class="tool-links">${level.tools.map(([name,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${name} ↗</a>`).join('')}</div><p class="helper-note">Los enlaces conducen a servicios externos; disponibilidad, precios y funcionalidades pueden cambiar. La recomendación no equivale a una validación de sus resultados.</p>`}
function render(){
 document.getElementById('roomTitle').textContent=room.title;
 document.getElementById('roomLead').textContent=room.summary;
 document.getElementById('panel').innerHTML=room.concepts;
 renderResearchLevel(0);
}
document.addEventListener('click',e=>{
 const levelButton=e.target.closest('[data-level]');
 if(levelButton)renderResearchLevel(Number(levelButton.dataset.level));
});
render();
</script></body></html>
